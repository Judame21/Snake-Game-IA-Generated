name: Build and analyze (Self-hosted + Local SonarQube)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build_and_analyze:
    # Solución 1: el runner corre en TU PC, así que localhost:9000 sí funciona
    runs-on: self-hosted

    env:
      SONAR_HOST_URL: "http://localhost:9000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instala dependencias (Windows/Linux)
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest coverage pytest-cov

      # Ejecuta tests + reportes que SonarQube importa
      - name: Run tests + coverage reports
        shell: pwsh
        run: |
          pytest --junitxml=pytest-report.xml --disable-warnings
          coverage run -m pytest
          coverage xml -o coverage.xml

      # SonarQube Scan (Server local)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
