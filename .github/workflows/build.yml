name: Build and analyze (Self-hosted + Local SonarQube)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build_and_analyze:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          python --version

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest coverage pytest-cov

      - name: Run tests
        shell: powershell
        run: |
          pytest --disable-warnings
          coverage run -m pytest
          coverage xml -o coverage.xml

      # ✅ IMPORTANTE: Scanner LOCAL (SIN action)
      - name: SonarQube Scan (LOCAL CLI)
        shell: powershell
        run: |
          sonar-scanner ^
            -Dsonar.host.url=http://localhost:9000 ^
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} ^
            -Dsonar.projectKey=test-local-sonar ^
            -Dsonar.sources=.
