name: Build and analyze (Local SonarQube)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build_and_analyze:
    # Solución 1: usar runner self-hosted (instalado en tu PC)
    # Si tu runner tiene etiquetas extra (por ejemplo "windows"), puedes usar:
    # runs-on: [self-hosted, windows]
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Recomendado para mejor relevancia del análisis
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest coverage pytest-cov

      - name: Run tests + coverage (reports for SonarQube)
        shell: bash
        run: |
          pytest --junitxml=pytest-report.xml --disable-warnings -q || true
          coverage run -m pytest -q || true
          coverage xml -o coverage.xml || true

      - name: SonarQube Scan (local server)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
